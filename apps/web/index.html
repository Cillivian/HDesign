<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="rust" data-canvas="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="HDesign 室内设计工作台：图纸识别、一句话生成方案、图层化 2D 编辑、水电点位与 2D/3D 出图。"
    />
    <meta name="theme-color" content="#F5F6F3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>HDesign · 室内设计工作台</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('hdesign.theme') || 'system';
          var accent = localStorage.getItem('hdesign.accent') || 'rust';
          var canvas = localStorage.getItem('hdesign.canvas') || 'paper';
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? 'dark' : 'light';
          root.dataset.accent = accent;
          root.dataset.canvas = canvas;
        } catch (error) {
          /* default tokens already applied */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
